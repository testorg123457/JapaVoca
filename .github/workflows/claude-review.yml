name: Claude Review (mechanical autofix)

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 봇이 방금 만든 커밋에는 다시 돌지 않음 (무한루프 방지)
    if: >-
      github.actor != 'claude[bot]' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--max-turns 20'
          prompt: |
            Mechanical code review for PR #${{ github.event.pull_request.number }}.
            Review ONLY the diff of this PR for: bugs, code-quality issues, and
            violations of the repository CLAUDE.md rules (cash-ledger integrity =
            ledger+wallet in one atomic transaction, design tokens single source /
            no hardcoded colors, emoji not used as functional icons, server-side
            answer/reward validation, etc).

            If you find such issues, FIX them directly and commit to this PR's
            branch. Keep fixes minimal and scoped to the problems found.

            Do NOT change the implementation's overall approach or direction —
            that is the human's decision. If the only concerns are about approach/
            direction (not bugs/quality), make no changes.

            If there are no mechanical issues, make no commits.
