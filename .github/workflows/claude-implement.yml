name: Claude Implement

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'claude'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: main
          show_full_output: true
          claude_args: '--max-turns 30 --allowedTools "Read,Edit,Write,MultiEdit,Bash,Glob,Grep,TodoWrite"'
          prompt: |
            Implement the change requested in GitHub issue #${{ github.event.issue.number }}
            for the JapaVoca monorepo, following the repository CLAUDE.md rules strictly
            (cash-ledger integrity, design tokens / no hardcoded colors, etc).

            Title: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            Make the minimal, focused file changes needed to resolve the issue, and add
            tests where the surrounding code already has them. Do not change unrelated code.

            Then commit your changes to a new branch named claude/issue-${{ github.event.issue.number }}
            and open a pull request targeting the main branch. The pull request description
            MUST include a "## 구현 요약" section covering:
            접근(approach) / 핵심 설계 결정 / 건드린 파일·구조 / 트레이드오프.
