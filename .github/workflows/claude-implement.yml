name: Claude Implement

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'claude'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: main
          claude_args: '--model opus --max-turns 200 --allowedTools "Read,Edit,Write,MultiEdit,Bash,Glob,Grep,TodoWrite"'
          prompt: |
            JapaVoca 모노레포의 GitHub 이슈 #${{ github.event.issue.number }}를 처리한다.
            저장소 CLAUDE.md 규칙(캐시 원장 정합성 등)을 반드시 따른다.

            제목: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            [1] 먼저 판단한다. 관련 코드를 실제로 열어보고 이 이슈에 변경이 필요한지 확인한다.
                이미 해결됐거나·재현되지 않거나·문제가 아니라고 판단되면 PR을 만들지 말고,
                이슈(#${{ github.event.issue.number }})에 "변경 불필요 + 근거(확인한 파일·위치)"를
                코멘트로 남기고 종료한다. 억지로 바꾸지 않는다.

            [2] 변경이 필요하면, 이슈가 단순하지 않은 경우 구현 전에 관련 코드·데이터 흐름·
                영향 범위를 먼저 분석한다(어디를 건드리면 무엇이 영향받는지). 그다음 구현한다.

            [3] 구현 원칙:
                - 기존 코드의 패턴·네이밍·구조를 따르고, 주변 코드처럼 읽히게 쓴다.
                - 디자인(UI) 변경 시 docs/디자인-시스템-원칙.md와 apps/mobile/src/theme/tokens.ts를
                  먼저 읽고, 이미 있는 디자인 시스템·토큰을 사용한다. 색·간격 하드코딩 금지.
                - 이슈에 필요한 최소·집중 변경만. 관련 없는 코드는 건드리지 않는다.
                - 변경 영역에 테스트가 있으면 테스트도 추가/갱신한다.

            [4] 품질: 단순하지 않으면 구현 전에 접근을 짧게 계획하고 엣지케이스·실패 경로를
                함께 고려한다(특히 캐시·동시성·서버 검증. 해피패스만 짜지 않는다).
                과하게 추상화하지 않는다(YAGNI). 새 의존성은 꼭 필요할 때만, 이유를 PR에 적는다.
                PR을 열기 전 자신이 바꾼 diff를 리뷰어의 눈으로 다시 읽고 발견한 문제를 고친다.

            [5] 테스트·린트·타입체크를 직접 실행하지 마라. 이 러너에는 node_modules도,
                파이썬 의존성도, Postgres도 없다(설치·기동 시도 금지 — 시간만 낭비된다).
                검증은 PR에 자동으로 붙는 CI 워크플로(.github/workflows/ci.yml)가 한다.
                대신 코드를 눈으로 정확히 맞춰라: import 경로·타입·시그니처·네이밍을
                실제 파일을 읽어 확인하고, 추측으로 쓰지 않는다.

            변경을 했다면 claude/issue-${{ github.event.issue.number }} 브랜치에 커밋하고 main으로
            PR을 연다. 구현이 끝나면 **먼저 커밋·푸시하고 PR을 연 뒤** 남은 정리를 한다
            (잡이 중간에 끊겨도 작업물이 남도록). PR 본문에 "## 구현 요약"(접근 /
            핵심 설계 결정 / 건드린 파일·구조 / 트레이드오프)을 포함한다.
